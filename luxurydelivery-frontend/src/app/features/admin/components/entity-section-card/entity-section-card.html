<article class="relative overflow-hidden rounded-2xl border border-white/10 bg-slate-900/60 p-5 shadow-lg shadow-black/20 backdrop-blur">
  <div class="pointer-events-none absolute inset-0 bg-gradient-to-br" [class]="'pointer-events-none absolute inset-0 bg-gradient-to-br ' + section().accentClass"></div>

  <div class="relative">
    <div class="flex items-center justify-between gap-3">
      <h3 class="text-lg font-medium text-white">{{ section().label }}</h3>
      <span
        class="rounded-full px-2.5 py-1 text-xs font-medium"
        [class]="section().status === 'ok' ? 'bg-emerald-400/15 text-emerald-300' : 'bg-rose-400/15 text-rose-300'"
      >
        {{ section().status === 'ok' ? 'Conectado' : 'Pendiente' }}
      </span>
    </div>

    <p class="mt-2 text-sm text-slate-300">{{ section().description }}</p>
    <p class="mt-5 text-3xl font-light text-amber-100">{{ section().total }}</p>

    <a
      class="mt-4 inline-flex items-center text-sm text-amber-200 transition hover:text-amber-100"
      [routerLink]="['/management', section().key]"
    >
      Abrir sección →
    </a>
  </div>
</article>

<div class="min-h-screen bg-slate-950 text-slate-100">
  <div class="mx-auto grid min-h-screen max-w-7xl grid-cols-1 lg:grid-cols-[280px_1fr]">
    <aside class="border-b border-white/10 bg-slate-900/70 p-6 lg:border-b-0 lg:border-r">
      <p class="text-xs uppercase tracking-[0.24em] text-amber-300">Luxury Delivery</p>
      <h1 class="mt-2 text-2xl font-light text-white">Admin Console</h1>
      <p class="mt-3 text-sm text-slate-400">Operaciones para una experiencia premium de comida a domicilio.</p>

      <nav class="mt-8 space-y-2">
        <a
          class="block rounded-xl border border-white/5 px-4 py-3 text-sm transition hover:border-amber-200/30 hover:bg-white/5"
          routerLink="/dashboard"
          routerLinkActive="bg-white/10 border-amber-200/50 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Vista general
        </a>

        @for (entity of entities; track entity.key) {
          <a
            class="block rounded-xl border border-white/5 px-4 py-3 text-sm transition hover:border-amber-200/30 hover:bg-white/5"
            [routerLink]="['/management', entity.key]"
            routerLinkActive="bg-white/10 border-amber-200/50 text-white"
          >
            {{ entity.label }}
          </a>
        }
      </nav>
    </aside>

    <section class="p-6 sm:p-8 lg:p-10">
      <router-outlet />
    </section>
  </div>
</div>

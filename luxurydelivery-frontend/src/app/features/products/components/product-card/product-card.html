<article class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm transition hover:shadow-md">
  <img
    [src]="product().image || 'https://placehold.co/600x400?text=Sin+imagen'"
    [alt]="product().name"
    class="mb-4 h-40 w-full rounded-md object-cover"
  />

  <div class="space-y-2">
    <span class="inline-block rounded-full bg-slate-100 px-2 py-1 text-xs font-medium text-slate-600">
      {{ product().category }}
    </span>

    <h3 class="text-lg font-semibold text-slate-900">{{ product().name }}</h3>

    <p class="text-xl font-bold text-emerald-700">{{ product().price | currencyFormat }}</p>

    <p class="text-sm text-slate-600">
      <strong>Alérgenos:</strong>
      @if (product().allergenList.length) {
        {{ product().allergenList.map(allergen => allergen.name).join(', ') }}
      } @else {
        Sin alérgenos declarados
      }
    </p>
  </div>
</article>

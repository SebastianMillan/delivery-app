<p-table [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template #header>
    <tr>
      <th>Code</th>
      <th>Name</th>
      <th>Category</th>
      <th>Quantity</th>
    </tr>
  </ng-template>
  <ng-template #body let-product>
    <tr>
      <td>a</td>
      <td>s</td>
      <td>ss</td>
      <td>dd</td>
    </tr>
  </ng-template>
</p-table>
